name: Cross-OS Desktop & POSIX Acceptance

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - ".github/workflows/ci-cross-os-desktop.yml"
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  obsidian-cross-os-e2e:
    name: H1 Cross-OS — Obsidian Runtime & Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: paperforge/plugin/package-lock.json
      - name: Use Homebrew Python with loadable SQLite extensions
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install python@3.11
          PF_PYTHON_BIN="$RUNNER_TEMP/pf-python-bin"
          mkdir -p "$PF_PYTHON_BIN"
          ln -sf "$(brew --prefix python@3.11)/bin/python3.11" "$PF_PYTHON_BIN/python"
          ln -sf "$(brew --prefix python@3.11)/bin/python3.11" "$PF_PYTHON_BIN/python3"
          ln -sf "$(brew --prefix python@3.11)/bin/pip3.11" "$PF_PYTHON_BIN/pip"
          echo "$PF_PYTHON_BIN" >> "$GITHUB_PATH"
          "$PF_PYTHON_BIN/python" -c "import sqlite3; assert hasattr(sqlite3.connect(':memory:'), 'enable_load_extension')"
      - name: Ensure Xvfb is installed for headless Linux Obsidian
        if: runner.os == 'Linux'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Cache Obsidian desktop binaries for fast Cross-OS E2E
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: paperforge/plugin/.obsidian-cache
          key: obsidian-${{ runner.os }}-latest-latest-v1
          restore-keys: |
            obsidian-${{ runner.os }}-
      - name: Give the E2E wheel a branch-only version
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import shutil

          init = pathlib.Path("paperforge/__init__.py")
          source = init.read_text(encoding="utf-8")
          match = re.search(r'__version__ = "([^"]+)"', source)
          if match is None:
              raise SystemExit("cannot read paperforge.__version__")
          base = match.group(1)
          bumped = f"{base}.post1"
          if base.endswith(".post1"):
              raise SystemExit("the E2E wheel version is already a post release")
          init.write_text(
              source.replace(f'__version__ = "{base}"', f'__version__ = "{bumped}"'),
              encoding="utf-8",
          )
          manifest = pathlib.Path("paperforge/plugin/manifest.json")
          mtext = manifest.read_text(encoding="utf-8")
          if f'"version": "{base}"' not in mtext:
              raise SystemExit("plugin manifest version does not match __version__")
          manifest.write_text(
              mtext.replace(f'"version": "{base}"', f'"version": "{bumped}"'),
              encoding="utf-8",
          )
          print(f"E2E wheel version: {bumped}")
          for stale in ("paperforge.egg-info", "build", "dist"):
              shutil.rmtree(stale, ignore_errors=True)
          PY
      - name: Install Python package
        run: python -m pip install -e ".[test,vector]"
      - name: Publish isolated runtime pointer for E2E
        run: python -c "from paperforge.runtime_pointer import publish_pointer; print(publish_pointer())"
      - name: Install plugin dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: paperforge/plugin
      - name: Build the wheel the first-use journey installs
        shell: bash
        run: |
          python -m pip install --quiet build
          python -m build --wheel
          WHEEL=$(ls dist/*.whl | head -1)
          python - "$WHEEL" <<'PY' >> "$GITHUB_ENV"
          import hashlib
          import os
          import sys

          print(
              "PF_E2E_WHEEL_SHA256="
              + hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest()
          )
          print("PIP_FIND_LINKS=" + os.path.abspath("dist"))
          PY
      - name: Run real Obsidian lifecycle on Linux (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm run test:e2e
        working-directory: paperforge/plugin
        env:
          PF_OBSIDIAN_APP_VERSION: latest
          PF_OBSIDIAN_INSTALLER_VERSION: latest
      - name: Run real Obsidian lifecycle on macOS
        if: runner.os == 'macOS'
        run: npm run test:e2e
        working-directory: paperforge/plugin
        env:
          PF_OBSIDIAN_APP_VERSION: latest
          PF_OBSIDIAN_INSTALLER_VERSION: latest
      - name: Validate the runtime journey gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          evidence_dir = Path("paperforge/plugin/test/evidence")
          expected = {
              "a01-first-use.json": "A01",
              "a06-reinstall-switch.json": "A06",
          }
          manifest = json.loads(
              Path("paperforge/plugin/manifest.json").read_text(encoding="utf-8")
          )
          version = manifest["version"]
          failures: list[str] = []

          for name, case_id in expected.items():
              path = evidence_dir / name
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except OSError:
                  failures.append(f"{case_id}: evidence file missing")
                  continue
              runs = data if isinstance(data, list) else [data]
              latest = runs[-1] if runs and isinstance(runs[-1], dict) else {}
              if latest.get("status") != "VERIFIED":
                  failures.append(f"{case_id}: status={latest.get('status')}")
                  continue
              pointer = latest.get("pointer") or latest.get("pointer_after") or {}
              if pointer.get("paperforgeVersion") != version:
                  failures.append(
                      f"{case_id}: pointer version {pointer.get('paperforgeVersion')!r} "
                      f"!= {version!r}"
                  )

          if failures:
              print("runtime journey gate FAILED: " + "; ".join(failures))
              sys.exit(1)
          print(f"runtime journey VERIFIED: {', '.join(expected.values())} @ {version}")
          PY
      - name: Preserve first-failure Obsidian evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-failure-obsidian-cross-os-${{ matrix.os }}
          path: |
            paperforge/plugin/test/evidence
            paperforge/plugin/.obsidian-cache/*.log
          if-no-files-found: warn
          retention-days: 14

  obsidian-cross-os-settings:
    name: H2 Cross-OS — Obsidian Settings & Migration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: paperforge/plugin/package-lock.json
      - name: Use Homebrew Python with loadable SQLite extensions
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install python@3.11
          PF_PYTHON_BIN="$RUNNER_TEMP/pf-python-bin"
          mkdir -p "$PF_PYTHON_BIN"
          ln -sf "$(brew --prefix python@3.11)/bin/python3.11" "$PF_PYTHON_BIN/python"
          ln -sf "$(brew --prefix python@3.11)/bin/python3.11" "$PF_PYTHON_BIN/python3"
          ln -sf "$(brew --prefix python@3.11)/bin/pip3.11" "$PF_PYTHON_BIN/pip"
          echo "$PF_PYTHON_BIN" >> "$GITHUB_PATH"
          "$PF_PYTHON_BIN/python" -c "import sqlite3; assert hasattr(sqlite3.connect(':memory:'), 'enable_load_extension')"
      - name: Ensure Xvfb is installed for headless Linux Obsidian
        if: runner.os == 'Linux'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Cache Obsidian desktop binaries for fast Cross-OS settings E2E
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: paperforge/plugin/.obsidian-cache
          key: obsidian-${{ runner.os }}-latest-latest-v1
          restore-keys: |
            obsidian-${{ runner.os }}-
      - name: Install Python package
        run: python -m pip install -e ".[test,vector]"
      - name: Publish isolated runtime pointer for Settings E2E
        run: python -c "from paperforge.runtime_pointer import publish_pointer; print(publish_pointer())"
      - name: Install plugin dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: paperforge/plugin
      - name: Run real Obsidian Settings & Migration Matrix on Linux (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm run test:e2e:settings
        working-directory: paperforge/plugin
        env:
          PF_OBSIDIAN_APP_VERSION: latest
          PF_OBSIDIAN_INSTALLER_VERSION: latest
      - name: Run real Obsidian Settings & Migration Matrix on macOS
        if: runner.os == 'macOS'
        run: npm run test:e2e:settings
        working-directory: paperforge/plugin
        env:
          PF_OBSIDIAN_APP_VERSION: latest
          PF_OBSIDIAN_INSTALLER_VERSION: latest
      - name: Preserve first-failure Settings Matrix evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-failure-obsidian-settings-${{ matrix.os }}
          path: |
            paperforge/plugin/test/evidence
            paperforge/plugin/.obsidian-cache/*.log
          if-no-files-found: warn
          retention-days: 14

  posix-cli-signal-acceptance:
    name: P Cross-OS — POSIX CLI Signal Stop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Use Homebrew Python with loadable SQLite extensions
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install python@3.11
          PF_PYTHON_BIN="$RUNNER_TEMP/pf-python-bin"
          mkdir -p "$PF_PYTHON_BIN"
          ln -sf "$(brew --prefix python@3.11)/bin/python3.11" "$PF_PYTHON_BIN/python"
          ln -sf "$(brew --prefix python@3.11)/bin/python3.11" "$PF_PYTHON_BIN/python3"
          ln -sf "$(brew --prefix python@3.11)/bin/pip3.11" "$PF_PYTHON_BIN/pip"
          echo "$PF_PYTHON_BIN" >> "$GITHUB_PATH"
          "$PF_PYTHON_BIN/python" -c "import sqlite3; assert hasattr(sqlite3.connect(':memory:'), 'enable_load_extension')"
      - name: Install package with test deps
        run: python -m pip install -e ".[test,vector]"
      - name: Run POSIX CLI cancellation acceptance cases
        shell: bash
        run: |
          python -m pytest \
            tests/harness/test_e04_embed_stop.py \
            tests/harness/test_d04_ocr_stop.py \
            -m harness -v --tb=short --timeout=300 \
            --junit-xml="$RUNNER_TEMP/paperforge-posix-cli-stop.xml"
        env:
          PF_EVIDENCE_DIR: ${{ github.workspace }}/tests/evidence/posix-cli-stop
      - name: Preserve first-failure POSIX CLI stop evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-failure-posix-cli-stop-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/paperforge-posix-cli-stop.xml
            tests/evidence/posix-cli-stop
          if-no-files-found: warn
          retention-days: 14
