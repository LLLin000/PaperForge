# TEMPORARY: one authorized A01 diagnostic, app 1.14.5 / installer 1.5.8.
# Authorized push run consumed; manual-only now. Another run needs owner approval.
# Original A01 assertions/timeouts and real egress gate remain unchanged.
# Native/Python process sampling and Chromium logs locate the install fault.
# A diagnostic failure is evidence, never a compatibility waiver.
# Gate: a01-run.mjs applies dead-proxy + per-program firewall egress BEFORE
# wdio, proves loopback CDP, and removes only its own rules AFTER the owned
# tree is verified stopped (fail-closed).

name: h-fixed-ab-diagnostic

on:
  workflow_dispatch:

jobs:
  fixed-ab:
    name: Single A01 native-install diagnosis (1.14.5 / 1.5.8)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full history for old/new refs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: paperforge/plugin/.nvmrc
          cache: npm
          cache-dependency-path: paperforge/plugin/package-lock.json

      - name: Setup Python 3.11 (diagnostic venv creator)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check (no browsers)
        shell: pwsh
        run: |
          node scripts/diagnostics/h-fixed-ab.mjs verify
          node --check scripts/diagnostics/a01-prefetch.mjs
          node --check scripts/diagnostics/a01-run.mjs
          node --check scripts/diagnostics/a01-run-old-if-needed.mjs

      - name: Prefetch host + bundles + per-baseline venvs (network allowed here)
        shell: pwsh
        run: node scripts/diagnostics/h-fixed-ab.mjs prefetch

      - name: Prefetch A01 new baseline (stamped wheel + wheels-only wheelhouse)
        shell: pwsh
        run: node scripts/diagnostics/a01-prefetch.mjs new

      - name: Prefetch paired app 1.14.5 asar (same installer/driver)
        shell: pwsh
        run: node scripts/diagnostics/a01-prefetch-app145.mjs

      - name: Run exactly one A01 with native process capture
        shell: pwsh
        env:
          A01_APP_ARM: "145"
          PF_DIAGNOSTIC_H_FULL: "0"
        run: node scripts/diagnostics/a01-run.mjs new

      - name: Report single terminal verdict
        if: always()
        shell: pwsh
        run: Get-Content a01-artifacts/result-new-app145.json

      - name: Upload cell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-fixed-ab-evidence
          # Scoped: receipts + verdicts + logs only. The prefetch trees
          # (src-old/src-new incl. node_modules), tarballs, and the binary
          # cache stay on the runner. No binaries except crash dumps.
          path: |
            h-fixed-ab-artifacts/prefetch/*.json
            h-fixed-ab-artifacts/summary*.json
            h-fixed-ab-artifacts/cells/**
            h-fixed-ab-artifacts/**/*safety*
            a01-artifacts/prefetch-*.json
            a01-artifacts/host-pins-app145.json
            a01-artifacts/result-*.json
            a01-artifacts/paired-summary-*.json
            a01-artifacts/cells/**
            !h-fixed-ab-artifacts/cells/**/*.exe
            !h-fixed-ab-artifacts/cells/**/*.asar
            !h-fixed-ab-artifacts/cells/**/node_modules/**
            !a01-artifacts/cells/**/*.exe
            !a01-artifacts/cells/**/*.asar
          if-no-files-found: error
