# TEMPORARY diagnostic workflow — A01 first-use setup journey (new baseline,
# conditional old only on historical renderer disconnect).
# Branch-only push trigger on diagnostics/h-fixed-ab; delete after evidence collected.
# Does NOT touch .github/workflows/ci.yml. No merge/push/PR actions.
# Exit semantics: step exit 0 means the A01 attempt finished with a terminal
# verdict (verified/failed/blocked). It does NOT mean the install passed.
# Verdicts live in a01-artifacts/result-*.json + cells/*/. Failure evidence,
# never green acceptance; no retries, no timeout increases.
# Gate: a01-run.mjs applies dead-proxy + per-program firewall egress BEFORE
# wdio (host/driver/node/staged-venv/selected base+exe), proves loopback
# CDP, and removes only its own rules AFTER the owned tree is stopped.

name: h-fixed-ab-diagnostic

on:
  push:
    branches: [diagnostics/h-fixed-ab]

jobs:
  fixed-ab:
    name: Full-H single host (new, conditional old)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full history for old/new refs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: paperforge/plugin/.nvmrc
          cache: npm
          cache-dependency-path: paperforge/plugin/package-lock.json

      - name: Setup Python 3.11 (diagnostic venv creator)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check (no browsers)
        shell: pwsh
        run: |
          node scripts/diagnostics/h-fixed-ab.mjs verify
          node --check scripts/diagnostics/a01-prefetch.mjs
          node --check scripts/diagnostics/a01-run.mjs
          node --check scripts/diagnostics/a01-run-old-if-needed.mjs

      - name: Prefetch host + bundles + per-baseline venvs (network allowed here)
        shell: pwsh
        run: node scripts/diagnostics/h-fixed-ab.mjs prefetch

      - name: Prefetch A01 new baseline (stamped wheel + wheels-only wheelhouse)
        shell: pwsh
        run: node scripts/diagnostics/a01-prefetch.mjs new

      - name: Run Full-H single host (egress-gated, 60min, no retries)
        shell: pwsh
        run: $env:PF_DIAGNOSTIC_H_FULL = "1"; node scripts/diagnostics/a01-run.mjs new

      - name: Conditional old baseline (renderer disconnect only)
        if: always()
        shell: pwsh
        run: node scripts/diagnostics/a01-run-old-if-needed.mjs

      - name: Report A01 verdicts
        if: always()
        shell: pwsh
        run: |
          Get-Content a01-artifacts/result-new.json
          if (Test-Path a01-artifacts/result-old.json) { Get-Content a01-artifacts/result-old.json }

      - name: Upload cell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-fixed-ab-evidence
          # Scoped: receipts + verdicts + logs only. The prefetch trees
          # (src-old/src-new incl. node_modules), tarballs, and the binary
          # cache stay on the runner. No binaries except crash dumps.
          path: |
            h-fixed-ab-artifacts/prefetch/*.json
            h-fixed-ab-artifacts/summary*.json
            h-fixed-ab-artifacts/cells/**
            h-fixed-ab-artifacts/**/*safety*
            a01-artifacts/prefetch-*.json
            a01-artifacts/result-*.json
            a01-artifacts/cells/**
            !h-fixed-ab-artifacts/cells/**/*.exe
            !h-fixed-ab-artifacts/cells/**/*.asar
            !h-fixed-ab-artifacts/cells/**/node_modules/**
            !a01-artifacts/cells/**/*.exe
            !a01-artifacts/cells/**/*.asar
          if-no-files-found: error
