# Single tag-release workflow (issue #121, P0-5).
# Previously release.yml and publish.yml both created the same tag's GitHub
# Release — one deleting while the other created, assets flapping. This
# workflow owns the whole chain: version/tag check → Python build → plugin
# tests/typecheck/build → PyPI publish → ONE GitHub Release.

name: Publish

on:
  push:
    tags:
      # Canonical numeric SemVer tags only. PEP 440 normalization happens in Gate 1.
      - '[0-9]*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: paperforge/plugin/package-lock.json

      # ── Gate 1: canonical SemVer tag → PEP 440 Python version.
      # Stable: 2.0.0. Prerelease: 2.0.0-alpha.1 / -beta.1 / -rc.1.
      - name: Version/tag sync check
        id: version_sync
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          PY_VERSION="$(python -c 'import sys; sys.path.insert(0, "paperforge"); import __init__; print(__init__.__version__)' 2>/dev/null || python -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("paperforge/__init__.py").read()).group(1))')"
          PLUGIN_VERSION="$(python -c 'import json; print(json.load(open("paperforge/plugin/manifest.json", encoding="utf-8"))["version"])')"
          python - "$TAG" "$PY_VERSION" "$PLUGIN_VERSION" <<'PY'
          import os
          import re
          import sys

          tag, python_version, plugin_version = sys.argv[1:]
          match = re.fullmatch(
              r"(?P<base>\d+\.\d+\.\d+)(?:-(?P<phase>alpha|beta|rc)\.(?P<serial>\d+))?",
              tag,
          )
          if match is None:
              raise SystemExit(
                  f"::error::unsupported release tag '{tag}'; expected "
                  "N.N.N or N.N.N-{alpha|beta|rc}.N"
              )

          base = match.group("base")
          phase = match.group("phase")
          serial = match.group("serial")
          pep440_phase = {"alpha": "a", "beta": "b", "rc": "rc"}
          expected_python = (
              base if phase is None else base + pep440_phase[phase] + serial
          )
          if python_version != expected_python:
              raise SystemExit(
                  f"::error::tag '{tag}' maps to Python '{expected_python}', "
                  f"but paperforge.__version__ is '{python_version}'"
              )
          if plugin_version not in {python_version, tag}:
              raise SystemExit(
                  "::error::unsupported source version pair: "
                  f"plugin manifest '{plugin_version}' must be "
                  f"Python '{python_version}' or release tag '{tag}'"
              )

          release_kind = "stable" if phase is None else "prerelease"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_kind={release_kind}\n")
          print(
              f"validated tag={tag} python={expected_python} "
              f"plugin_source={plugin_version} kind={release_kind}"
          )
          PY

      # ── Gate 1.5: wait for the SAME SHA's full CI (alls-green) before
      # touching PyPI — a tag pushed alongside the bump commit must not
      # publish while unit/protocol/OCR/plugin suites are still running
      # (review P0-5).
      - name: Wait for All Checks Passed on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHA="${{ github.sha }}"
          for i in $(seq 1 60); do
            GREEN=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name == "All Checks Passed")][0].conclusion' 2>/dev/null || echo "missing")
            if [ "$GREEN" = "success" ]; then
              echo "All Checks Passed: success on $SHA"
              exit 0
            fi
            if [ "$GREEN" = "failure" ] || [ "$GREEN" = "cancelled" ] || [ "$GREEN" = "timed_out" ]; then
              echo "::error::All Checks Passed: $GREEN on $SHA — refusing to publish"
              exit 1
            fi
            echo "waiting for CI on $SHA (attempt $i/60, state=$GREEN)..."
            sleep 15
          done
          echo "::error::All Checks Passed did not finish within 15 minutes on $SHA"
          exit 1

      # ── Gate 2: Python package builds + imports with vector extras.
      - name: Build Python package
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify wheel imports vector stack
        run: |
          # #120-fix (P0-3): --no-deps + bare import always fails on a
          # clean runner — openai/sqlite_vec/chromadb live in the vector
          # extras, not in base deps. Install the wheel WITH extras into
          # an isolated venv so the smoke proves wheel installability,
          # extras metadata, and the vector runtime all at once.
          WHEEL="$(ls dist/*.whl | head -1)"
          python -m venv /tmp/paperforge-release-smoke
          /tmp/paperforge-release-smoke/bin/python -m pip install --quiet "${WHEEL}[vector]"
          /tmp/paperforge-release-smoke/bin/python -I -c \
            "import paperforge, openai, sqlite_vec; print('vector deps ok:', paperforge.__version__)"

      # ── Gate 3: plugin tests + typecheck + bundle build.
      - name: Install plugin deps
        working-directory: paperforge/plugin
        run: npm ci

      - name: Run plugin tests
        working-directory: paperforge/plugin
        run: npx vitest run --reporter=verbose

      - name: Typecheck plugin
        working-directory: paperforge/plugin
        run: npm run typecheck

      - name: Build plugin bundle
        working-directory: paperforge/plugin
        run: npm run build

      # Project the plugin-only release metadata to SemVer for BRAT/GitHub.
      # Python/PyPI stays canonical PEP 440; the source tree remains unchanged.
      - name: Project plugin prerelease metadata
        if: steps.version_sync.outputs.release_kind == 'prerelease'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - "$RELEASE_TAG" <<'PY'
          import json
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          manifest_path = Path("paperforge/plugin/manifest.json")
          versions_path = Path("paperforge/plugin/versions.json")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = tag
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          versions = json.loads(versions_path.read_text(encoding="utf-8"))
          versions[tag] = manifest["minAppVersion"]
          versions_path.write_text(
              json.dumps(versions, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"projected plugin metadata version={tag}")
          PY

      # ── Gate 4: PyPI (skip-existing only protects against reruns of the
      # SAME version — the version/tag gate above prevents stale tags).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true

      # ── Gate 5: ONE GitHub Release with plugin + Python artifacts.
      - name: Determine release type
        id: release_type
        run: |
          set -euo pipefail
          case "${{ steps.version_sync.outputs.release_kind }}" in
            stable)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
            prerelease)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::version sync did not produce a valid release kind"
              exit 1
              ;;
          esac

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PRERELEASE="${{ steps.release_type.outputs.prerelease }}"
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then PRERELEASE_FLAG="--prerelease"; fi
          # #120-fix (P1-4): idempotent rerun — a failure after release
          # create must not deadlock the rerun on "release already exists".
          if ! gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
          # #120-fix (review): upload ALL assets with --clobber — a rerun
          # after a mid-upload failure must backfill every missing asset,
          # not just the checksum.
          sha256sum paperforge/plugin/main.js paperforge/plugin/styles.css \
            paperforge/plugin/manifest.json paperforge/plugin/versions.json \
            dist/*.whl dist/*.tar.gz > checksums.txt
          gh release upload "${{ github.ref_name }}" --clobber \
            paperforge/plugin/main.js \
            paperforge/plugin/styles.css \
            paperforge/plugin/manifest.json \
            paperforge/plugin/versions.json \
            dist/*.whl \
            dist/*.tar.gz \
            checksums.txt
