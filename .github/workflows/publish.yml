# Single tag-release workflow (issue #121, P0-5; hardened per PF-SEC-003 / PF-SEC-010).
# Owns the full release chain: version/tag + SHA identity gate → CI green wait →
# plugin tests/typecheck/build → deterministic Python wheel/sdist → ONE GitHub
# Release (fail-closed checksums, no --clobber) → optional PyPI OIDC mirror.

name: Publish

on:
  push:
    tags:
      # Canonical numeric SemVer tags only. PEP 440 normalization happens in Gate 1.
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag / SemVer version (e.g. 2.0.7; defaults to paperforge.__version__)"
        required: false
        type: string
      prerelease:
        description: "GitHub Release channel mode (auto uses tag suffix; true publishes as Pre-release; false promotes to Stable)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - "true"
          - "false"
      publish_pypi:
        description: "Also publish Python wheel/sdist to PyPI via OIDC (optional; GitHub Release .whl is primary)"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-native-daemon:
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: paperforge-daemon-x86_64-unknown-linux-musl
            bin: paperforge-daemon
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: paperforge-daemon-aarch64-unknown-linux-musl
            bin: paperforge-daemon
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: paperforge-daemon-aarch64-apple-darwin
            bin: paperforge-daemon
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: paperforge-daemon-x86_64-apple-darwin
            bin: paperforge-daemon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: paperforge-daemon-x86_64-pc-windows-msvc.exe
            bin: paperforge-daemon.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: paperforge-daemon-aarch64-pc-windows-msvc.exe
            bin: paperforge-daemon.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust target (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl cross toolchain (Linux static zero-glibc dependency)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            python3 -m pip install --quiet --break-system-packages "ziglang==0.17.1" "cargo-zigbuild==0.24.1" || python3 -m pip install --quiet "ziglang==0.17.1" "cargo-zigbuild==0.24.1"
          else
            sudo apt-get update
            sudo apt-get install -y musl-tools
          fi

      - name: Build native Rust daemon (${{ matrix.target }})
        working-directory: crates/paperforge-daemon
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Ad-hoc codesign binary on macOS (Apple Silicon / Gatekeeper)
        if: runner.os == 'macOS'
        run: codesign --force --sign - "crates/paperforge-daemon/target/${{ matrix.target }}/release/${{ matrix.bin }}"

      - name: Smoke test native binary (--version + stdio daemon.health)
        if: >-
          matrix.target == 'x86_64-unknown-linux-musl' ||
          matrix.target == 'aarch64-apple-darwin' ||
          matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          BIN="crates/paperforge-daemon/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          "$BIN" --version
          RESP=$(printf '{"id":1,"op":"daemon.health"}\n{"id":2,"op":"shutdown"}\n' | "$BIN" --stdio --idle-timeout 15 | head -n 1)
          echo "health response: $RESP"
          echo "$RESP" | grep -q '"ok":true'
          echo "$RESP" | grep -q '"exit_code":0'
          echo "$RESP" | grep -q 'rust-native'

      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p dist-daemon
          cp "crates/paperforge-daemon/target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist-daemon/${{ matrix.asset }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-daemon-${{ matrix.target }}
          path: dist-daemon/${{ matrix.asset }}

  chaos-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-chaos.yml

  publish:
    needs: [build-native-daemon, chaos-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: paperforge/plugin/package-lock.json

      # ── Gate 1: canonical SemVer tag → PEP 440 Python version + manifest/Cargo parity.
      # Stable: 2.0.7. Prerelease: 2.0.7-alpha.1 / -beta.1 / -rc.1.
      - name: Version/tag sync check
        id: version_sync
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          PY_VERSION="$(python -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("paperforge/__init__.py", encoding="utf-8").read()).group(1))')"
          PLUGIN_VERSION="$(python -c 'import json; print(json.load(open("paperforge/plugin/manifest.json", encoding="utf-8"))["version"])')"
          ROOT_MANIFEST_VERSION="$(python -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version"])')"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="$PY_VERSION"
          fi
          python - "$TAG" "$PY_VERSION" "$PLUGIN_VERSION" "$ROOT_MANIFEST_VERSION" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag, python_version, plugin_version, root_manifest_version = sys.argv[1:]
          match = re.fullmatch(
              r"(?P<base>\d+\.\d+\.\d+)(?:-(?P<phase>alpha|beta|rc)\.(?P<serial>\d+))?",
              tag,
          )
          if match is None:
              raise SystemExit(
                  f"::error::unsupported release tag '{tag}'; expected "
                  "N.N.N or N.N.N-{alpha|beta|rc}.N"
              )

          base = match.group("base")
          phase = match.group("phase")
          serial = match.group("serial")
          pep440_phase = {"alpha": "a", "beta": "b", "rc": "rc"}
          expected_python = (
              base if phase is None else base + pep440_phase[phase] + serial
          )
          if python_version != expected_python:
              raise SystemExit(
                  f"::error::tag '{tag}' maps to Python '{expected_python}', "
                  f"but paperforge.__version__ is '{python_version}'"
              )
          if plugin_version not in {python_version, tag}:
              raise SystemExit(
                  "::error::unsupported source version pair: "
                  f"plugin manifest '{plugin_version}' must be "
                  f"Python '{python_version}' or release tag '{tag}'"
              )
          if root_manifest_version != plugin_version:
              raise SystemExit(
                  "::error::root manifest.json version "
                  f"'{root_manifest_version}' disagrees with plugin manifest '{plugin_version}'"
              )

          cargo_toml = Path("crates/paperforge-daemon/Cargo.toml").read_text(encoding="utf-8")
          cargo_match = re.search(r'^version\s*=\s*"([^"]+)"', cargo_toml, re.MULTILINE)
          cargo_version = cargo_match.group(1) if cargo_match else ""
          if cargo_version not in {python_version, tag}:
              raise SystemExit(
                  "::error::crates/paperforge-daemon/Cargo.toml version "
                  f"'{cargo_version}' must match '{python_version}' or '{tag}'"
              )

          release_kind = "stable" if phase is None else "prerelease"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_tag={tag}\n")
              output.write(f"release_kind={release_kind}\n")
          print(
              f"validated tag={tag} python={expected_python} "
              f"plugin_source={plugin_version} cargo={cargo_version} kind={release_kind}"
          )
          PY

      # ── Gate 1.2: Release Identity Gate BEFORE any builds or irreversible publish.
      - name: Release identity gate (Tag vs SHA)
        env:
          RELEASE_TAG: ${{ steps.version_sync.outputs.release_tag }}
        run: |
          set -euo pipefail
          EXISTING_TAG_SHA=$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" | tail -n 1 | awk '{print $1}')
          if [ -n "$EXISTING_TAG_SHA" ] && [ "$EXISTING_TAG_SHA" != "${{ github.sha }}" ]; then
            echo "::error::Release Identity Gate failed: tag '${RELEASE_TAG}' already points to ${EXISTING_TAG_SHA}, not ${{ github.sha }}. Bump the version for a new release."
            exit 1
          fi
          echo "Release Identity Gate passed (tag=${RELEASE_TAG}, sha=${{ github.sha }})."

      # ── Gate 1.5: wait for the SAME SHA's latest full CI (All Checks Passed)
      # before building/publishing — a tag pushed alongside the bump commit must
      # not publish while unit/protocol/OCR/plugin suites are still running.
      - name: Wait for All Checks Passed on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          for i in $(seq 1 60); do
            GREEN=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name == "All Checks Passed")] | sort_by(.id) | last | .conclusion // "missing"' 2>/dev/null || echo "missing")
            if [ "$GREEN" = "success" ]; then
              echo "All Checks Passed: success on $SHA"
              exit 0
            fi
            if [ "$GREEN" = "failure" ] || [ "$GREEN" = "cancelled" ] || [ "$GREEN" = "timed_out" ]; then
              echo "::error::All Checks Passed: $GREEN on $SHA — refusing to publish"
              exit 1
            fi
            echo "waiting for CI on $SHA (attempt $i/60, state=$GREEN)..."
            sleep 15
          done
          echo "::error::All Checks Passed did not finish within 15 minutes on $SHA"
          exit 1

      # ── Gate 2: plugin tests + typecheck + bundle build + prerelease projection
      # MUST run BEFORE building the Python wheel so the wheel embeds the exact
      # built main.js and projected manifest/versions metadata.
      - name: Install package with plugin test deps
        run: python -m pip install -e ".[test]"

      - name: Point plugin protocol tests at the job interpreter
        run: echo "PF_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Install plugin deps
        working-directory: paperforge/plugin
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run plugin tests
        working-directory: paperforge/plugin
        env:
          PF_PERF_ENFORCE_BUDGETS: "1"
        run: npx vitest run --reporter=verbose

      - name: Typecheck plugin
        working-directory: paperforge/plugin
        run: npm run typecheck

      - name: Build plugin bundle
        working-directory: paperforge/plugin
        run: npm run build

      - name: Project plugin prerelease metadata
        if: steps.version_sync.outputs.release_kind == 'prerelease'
        env:
          RELEASE_TAG: ${{ steps.version_sync.outputs.release_tag }}
        run: |
          python - "$RELEASE_TAG" <<'PY'
          import json
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          manifest_path = Path("paperforge/plugin/manifest.json")
          versions_path = Path("versions.json")
          plugin_versions_path = Path("paperforge/plugin/versions.json")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = tag
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          for vp in (versions_path, plugin_versions_path):
              versions = json.loads(vp.read_text(encoding="utf-8"))
              versions[tag] = manifest["minAppVersion"]
              vp.write_text(
                  json.dumps(versions, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
          print(f"projected plugin metadata version={tag}")
          PY

      # ── Gate 3: deterministic Python package build (SOURCE_DATE_EPOCH) + wheel verify.
      - name: Build Python package (deterministic)
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "Using SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          python -m build

      - name: Verify wheel hygiene and vector stack
        run: |
          set -euo pipefail
          WHEEL="$(ls dist/*.whl | head -1)"
          python - "$WHEEL" <<'PY'
          import sys, zipfile
          wheel = sys.argv[1]
          forbidden = (
              "package-lock.json",
              "package.json",
              "tsconfig.json",
              "paperforge/plugin/test/",
              "paperforge/plugin/tests/",
              "paperforge/plugin/prototypes/",
              "paperforge/skills/architecture-review/",
          )
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
              leaked = [n for n in names if any(f in n for f in forbidden)]
              if leaked:
                  raise SystemExit(f"::error::Wheel leaked dev/test files: {leaked}")
              required = (
                  "paperforge/plugin/main.js",
                  "paperforge/plugin/styles.css",
                  "paperforge/plugin/manifest.json",
                  "paperforge/plugin/versions.json",
                  "paperforge/skills/paperforge/SKILL.md",
              )
              missing = [r for r in required if r not in names]
              if missing:
                  raise SystemExit(f"::error::Wheel missing required runtime assets: {missing}")
          print(f"Wheel hygiene verified ({len(names)} entries): {wheel}")
          PY
          python -m venv /tmp/paperforge-release-smoke
          /tmp/paperforge-release-smoke/bin/python -m pip install --quiet "${WHEEL}[vector]"
          /tmp/paperforge-release-smoke/bin/python -I -c \
            "import paperforge, openai, sqlite_vec; print('vector deps ok:', paperforge.__version__)"

      # ── Gate 4: ONE GitHub Release with fail-closed checksums and idempotent retry.
      - name: Determine release type
        id: release_type
        env:
          PRE_OVERRIDE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRE_OVERRIDE" = "true" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [ "$PRE_OVERRIDE" = "false" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            case "${{ steps.version_sync.outputs.release_kind }}" in
              stable)
                echo "prerelease=false" >> "$GITHUB_OUTPUT"
                ;;
              prerelease)
                echo "prerelease=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::error::version sync did not produce a valid release kind"
                exit 1
                ;;
            esac
          fi

      - name: Download native Rust daemon binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-daemon-*
          path: dist-daemon
          merge-multiple: true

      - name: Create or update GitHub Release (fail-closed checksums, no --clobber)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version_sync.outputs.release_tag }}
          PRERELEASE: ${{ steps.release_type.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Compute deterministic checksums across all release assets.
          shopt -s nullglob
          ASSETS=(
            paperforge/plugin/main.js
            paperforge/plugin/styles.css
            paperforge/plugin/manifest.json
            versions.json
            dist/*.whl
            dist/*.tar.gz
            dist-daemon/paperforge-daemon-*
          )
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::No release assets staged"
            exit 1
          fi
          sha256sum "${ASSETS[@]}" | awk '{n=split($2,a,"/"); print $1 "  " a[n]}' > checksums.txt

          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then PRERELEASE_FLAG="--prerelease"; fi

          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # Create as Draft first so users never observe partial uploads before
            # all binaries, plugin files, and checksums.txt are verified.
            gh release create "$RELEASE_TAG" \
              --target "${{ github.sha }}" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --draft \
              $PRERELEASE_FLAG
            gh release upload "$RELEASE_TAG" checksums.txt
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}"
          else
            EXISTING_ASSETS_JSON=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            EXISTING_COUNT=$(printf '%s\n' "$EXISTING_ASSETS_JSON" | grep -c . || true)

            if [ "$EXISTING_COUNT" -gt 0 ]; then
              if ! printf '%s\n' "$EXISTING_ASSETS_JSON" | grep -qx 'checksums.txt'; then
                echo "::error::Fail-closed: existing release '$RELEASE_TAG' has $EXISTING_COUNT asset(s) but is missing checksums.txt. Refusing to overwrite or append unverified assets."
                exit 1
              fi
              gh release download "$RELEASE_TAG" -p checksums.txt -O /tmp/existing-checksums.txt
              python - /tmp/existing-checksums.txt checksums.txt <<'PY'
          import os, sys
          def parse(p):
              out = {}
              for line in open(p, encoding="utf-8"):
                  parts = line.strip().split()
                  if len(parts) >= 2:
                      out[os.path.basename(parts[-1].lstrip("*"))] = parts[0].lower()
              return out
          old_map = parse(sys.argv[1])
          new_map = parse(sys.argv[2])
          if not old_map:
              raise SystemExit("::error::Existing checksums.txt is empty — failing closed.")
          drift = [k for k, v in old_map.items() if k in new_map and new_map[k] != v]
          if drift:
              raise SystemExit(
                  f"::error::Release Asset Immutability Gate failed: existing release assets differ in SHA-256 ({', '.join(sorted(drift))}). Bump the version instead of mutating published assets."
              )
          missing_manifest = [k for k in new_map if k not in old_map]
          if missing_manifest:
              raise SystemExit(
                  f"::error::Existing checksums.txt does not cover new assets ({', '.join(sorted(missing_manifest))})."
              )
          print("Release Asset Immutability Gate passed (idempotent same-SHA retry verified).")
          PY

              TMP_VERIFY_DIR=$(mktemp -d)
              trap 'rm -rf "$TMP_VERIFY_DIR"' EXIT
              for asset in "${ASSETS[@]}"; do
                base=$(basename "$asset")
                if printf '%s\n' "$EXISTING_ASSETS_JSON" | grep -qx "$base"; then
                  gh release download "$RELEASE_TAG" -p "$base" -D "$TMP_VERIFY_DIR"
                  ACTUAL_SHA=$(sha256sum "$TMP_VERIFY_DIR/$base" | awk '{print tolower($1)}')
                  EXPECTED_SHA=$(awk -v f="$base" '$2 == f || $2 == "*"f {print tolower($1); exit}' checksums.txt)
                  if [ -z "$ACTUAL_SHA" ] || [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
                    echo "::error::Remote asset byte mismatch for '$base': remote=$ACTUAL_SHA expected=$EXPECTED_SHA"
                    exit 1
                  fi
                  rm -f "$TMP_VERIFY_DIR/$base"
                fi
              done
            else
              # Release existed with 0 assets: upload checksums.txt first.
              gh release upload "$RELEASE_TAG" checksums.txt
              EXISTING_ASSETS_JSON="checksums.txt"
            fi

            # Upload ONLY missing assets (never --clobber over published immutable assets).
            MISSING_ASSETS=()
            for asset in "${ASSETS[@]}"; do
              base=$(basename "$asset")
              if ! printf '%s\n' "$EXISTING_ASSETS_JSON" | grep -qx "$base"; then
                MISSING_ASSETS+=("$asset")
              fi
            done
            if [ "${#MISSING_ASSETS[@]}" -gt 0 ]; then
              echo "Uploading ${#MISSING_ASSETS[@]} missing release asset(s)..."
              gh release upload "$RELEASE_TAG" "${MISSING_ASSETS[@]}"
            else
              echo "All release assets and checksums.txt already present and verified."
            fi
          fi

          # Verify full asset set is present on the release BEFORE leaving Draft.
          FINAL_ASSETS=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if ! printf '%s\n' "$FINAL_ASSETS" | grep -qx 'checksums.txt'; then
            echo "::error::Release '$RELEASE_TAG' missing checksums.txt after upload — keeping Draft."
            exit 1
          fi
          for asset in "${ASSETS[@]}"; do
            base=$(basename "$asset")
            if ! printf '%s\n' "$FINAL_ASSETS" | grep -qx "$base"; then
              echo "::error::Release '$RELEASE_TAG' missing asset '$base' after upload — keeping Draft."
              exit 1
            fi
          done

          # Atomically publish (and align prerelease/stable channel state) only after
          # all uploads and SHA-256 checks succeed.
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"

      # ── Gate 5: Optional PyPI mirror via OIDC Trusted Publishing (runs AFTER
      # GitHub Release succeeds so PyPI never publishes ahead of GitHub).
      - name: Publish to PyPI (optional, OIDC Trusted Publishing)
        if: github.event.inputs.publish_pypi == 'true' || vars.ENABLE_PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
