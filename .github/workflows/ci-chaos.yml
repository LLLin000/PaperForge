name: Chaos Tests (L6)

on:
  schedule:
    # Weekly: Sunday 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:
    # Manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  chaos-tests:
    name: Chaos / Destructive Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package with test dependencies
        run: |
          pip install -e ".[test]"
          pip install pytest pytest-timeout responses PyYAML

      - name: Run PBAF v2.1 static audit & privacy gate
        run: |
          python scripts/backend_audit.py --strict
          python scripts/check_machine_paths.py

      - name: Run chaos tests
        run: |
          python -m pytest tests/chaos/ -m chaos -v --tb=long --timeout=120 --junit-xml=chaos-results-${{ matrix.os }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chaos-test-results-${{ matrix.os }}
          path: chaos-results-${{ matrix.os }}.xml
