# CI — Simplified Pipeline
# Runs on push/PR to master. All tests run (no -x early exit).

name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  # ---------------------------------------------------------------------------
  # L0 — Version consistency check
  # ---------------------------------------------------------------------------
  static:
    name: L0 — Static (version sync + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e .
      - name: Check version consistency
        run: python scripts/check_version_sync.py
      # Undefined names only (F821/F822/F823): the full lint rule set is not a
      # merge gate here, and this is the class that ships a NameError.
      - name: Ruff static gate
        run: pip install ruff && ruff check paperforge --select F821,F822,F823

  # ---------------------------------------------------------------------------
  # L1 — Unit tests (3 OS x 1 Python)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: L1 — Unit Tests (${{ matrix.os }}, py3.11)
    strategy:
      fail-fast: false
      # ubuntu is not a cell: python-suite runs tests/ (which includes
      # tests/unit) on that OS already. The remaining cells are the only
      # cross-platform signal for path/encoding behaviour.
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Use Homebrew Python with loadable SQLite extensions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install python@3.11
          PF_PYTHON_BIN="$RUNNER_TEMP/pf-python-bin"
          mkdir -p "$PF_PYTHON_BIN"
          ln -sf "$(brew --prefix python@3.11)/bin/python3.11" "$PF_PYTHON_BIN/python"
          ln -sf "$(brew --prefix python@3.11)/bin/pip3.11" "$PF_PYTHON_BIN/pip"
          echo "$PF_PYTHON_BIN" >> "$GITHUB_PATH"
          "$PF_PYTHON_BIN/python" -c "import sqlite3; assert hasattr(sqlite3.connect(':memory:'), 'enable_load_extension')"
      - name: Install package with test deps
        run: pip install -e ".[test,vector]"
      - name: Run unit tests
        shell: bash
        run: |
          python -m pytest tests/unit/ \
            -v --tb=short --timeout=60 \
            --junit-xml="$RUNNER_TEMP/paperforge-unit-tests.xml"
      - name: Preserve first-failure unit evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-unit-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/paperforge-unit-tests.xml
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # L1.5 — J-matrix headless gates (#146): 3-OS machine contracts
  # ---------------------------------------------------------------------------
  # J1  machine contract fixtures (probe read models, PFResult/JSON/text/progress
  #     NDJSON contracts)
  # J2  headless sync + vault preservation (.obsidian byte-for-byte untouched)
  # J3  deterministic OCR (state machine + progress contracts, no live API)
  j-matrix:
    name: J-Matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Use Homebrew Python with loadable SQLite extensions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install python@3.11
          PF_PYTHON_BIN="$RUNNER_TEMP/pf-python-bin"
          mkdir -p "$PF_PYTHON_BIN"
          ln -sf "$(brew --prefix python@3.11)/bin/python3.11" "$PF_PYTHON_BIN/python"
          ln -sf "$(brew --prefix python@3.11)/bin/pip3.11" "$PF_PYTHON_BIN/pip"
          echo "$PF_PYTHON_BIN" >> "$GITHUB_PATH"
          "$PF_PYTHON_BIN/python" -c "import sqlite3; assert hasattr(sqlite3.connect(':memory:'), 'enable_load_extension')"
      - name: Install package with test deps
        run: pip install -e ".[test,vector]"
      - name: J1 — machine contract fixtures
        shell: bash
        run: |
          python -m pytest \
            tests/test_probe.py \
            tests/test_read_model_cutover.py \
            tests/test_lineage.py \
            tests/test_credentials.py \
            tests/test_action_registry.py \
            tests/cli/test_json_contracts.py \
            tests/cli/test_text_contracts.py \
            tests/cli/test_ocr_progress_contracts.py \
            -q --tb=short --timeout=120 \
            --junit-xml="$RUNNER_TEMP/paperforge-j-matrix-j1.xml"
      # #224: the backend import-boundary check and the CI coverage contract are
      # what keep the other gates honest — a job that cannot fail, or a test file
      # no job collects, is invisible in a green run. Both must run on every push.
      - name: J1b — CI coverage + backend boundary contracts (#224)
        shell: bash
        run: |
          python -m pytest \
            tests/test_ci_coverage_contract.py \
            tests/test_architecture_boundaries.py \
            tests/test_note_set_flag.py \
            -q --tb=short --timeout=120 \
            --junit-xml="$RUNNER_TEMP/paperforge-j-matrix-j1b.xml"
      - name: J2 — headless sync + vault preservation
        shell: bash
        run: |
          python -m pytest \
            tests/journey/test_headless_sync_preservation.py \
            -q --tb=short --timeout=120 \
            --junit-xml="$RUNNER_TEMP/paperforge-j-matrix-j2.xml"
      - name: J3 — deterministic OCR
        shell: bash
        run: |
          python -m pytest \
            tests/test_ocr_state_machine.py \
            -q --tb=short --timeout=120 \
            --junit-xml="$RUNNER_TEMP/paperforge-j-matrix-j3.xml"
      - name: Preserve first-failure J-matrix evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-j-matrix-${{ matrix.os }}
          path: ${{ runner.temp }}/paperforge-j-matrix-*.xml
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # L3 — Plugin tests (Vitest)
  # ---------------------------------------------------------------------------
  plugin-tests:
    name: L3 — Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: paperforge/plugin/package-lock.json
      # #195 (W02): the protocol-conformance suite drives the real CLI through
      # the real transport, so this job needs an interpreter that can import
      # paperforge. Without it those cases would fail for a reason unrelated to
      # the code under test.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with test deps
        run: pip install -e ".[test]"
      # `python` on PATH is not always the interpreter setup-python installed
      # (the tool cache holds it; /usr/bin/python is a different install), so
      # the protocol suite is told which one to use instead of guessing.
      - name: Point the protocol suite at the job interpreter
        run: echo "PF_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: paperforge/plugin
      - run: npx vitest run --reporter=junit --outputFile="$RUNNER_TEMP/paperforge-plugin-tests.xml"
        working-directory: paperforge/plugin
      # #121 (P0-6): a TypeScript compile failure or broken bundle must block
      # merge — tests alone are not a build gate.
      - run: npm run typecheck
        working-directory: paperforge/plugin
      - run: npm run build
        working-directory: paperforge/plugin
      - name: Preserve first-failure plugin evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-plugin-tests
          path: ${{ runner.temp }}/paperforge-plugin-tests.xml
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # L1b — Full Python Suite (#224 / Block A: CI collection convergence)
  # ---------------------------------------------------------------------------
  # L1 runs tests/unit/ on three OS for fast per-OS signal; this job runs the
  # rest of the tree, so a test file nobody collected cannot sit at the
  # repository root looking green. Architecture fixture tests (including every
  # retained golden evidence pin) are collected here as part of #231.
  # e2e, audit and chaos are excluded here
  # because they have dedicated jobs (L4) or a dedicated workflow
  # (ci-chaos.yml) and running them twice buys nothing.
  python-suite:
    name: L1b — Full Python Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: paperforge/plugin/package-lock.json
      - name: Install package with test deps
        run: pip install -e ".[test,vector,legacy-vector]"
      # The architecture-audit collector cases drive ts_collect.js, which
      # requires `typescript`; without it those cases fail for a reason
      # unrelated to the code under test.
      - name: Install plugin dependencies (TypeScript compiler for the collector)
        run: npm ci
        working-directory: paperforge/plugin
      - name: Verify architecture generator and golden fixture pins (#231)
        run: python -m pytest tests/test_architecture_audit_fixtures.py -q --tb=short --timeout=180 --junit-xml="$RUNNER_TEMP/paperforge-architecture-fixtures.xml"
      - name: Run the full suite
        run: |
          python -m pytest tests/ \
            --ignore=tests/e2e \
            --ignore=tests/audit \
            --ignore=tests/chaos \
            --ignore=tests/harness \
            -q --tb=short --timeout=180 \
            --junit-xml="$RUNNER_TEMP/paperforge-python-suite.xml"
      - name: Preserve first-failure Python-suite evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-python-suite
          path: ${{ runner.temp }}/paperforge-*.xml
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # L2 — Release-protocol integration tests (shadow rebuild + retrieval)
  # ---------------------------------------------------------------------------

  e2e-tests:
    name: L4 — E2E + Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with test deps
        run: pip install -e ".[test,vector]"
      - name: Run E2E tests
        run: python -m pytest tests/e2e/ -m e2e -v --tb=short --timeout=120 --junit-xml="$RUNNER_TEMP/paperforge-e2e-tests.xml"
      - name: Run audit tests
        run: python -m pytest tests/audit/ -m audit -v --tb=short --timeout=120 --junit-xml="$RUNNER_TEMP/paperforge-audit-tests.xml"
      - name: Preserve first-failure E2E/audit evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-e2e-audit
          path: ${{ runner.temp }}/paperforge-*-tests.xml
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # L4b — Architecture deterministic gate (#134, review: independent job)
  # ---------------------------------------------------------------------------
  # Runs regardless of the E2E/audit outcome so one commit reports each
  # contract independently: "product E2E red / architecture green" instead of
  # the first failure hiding the rest. Consumes DeterministicAudit only;
  # Review/HTML never affect exit status.
  #
  # #229: deterministic authority bindings make the six formerly unresolved
  # blocking rules evaluable on a clean checkout. Keep strict enabled so a
  # future incomplete audit fails closed instead of passing as "skipped".
  architecture-gate:
    name: L4b — Architecture Deterministic Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: paperforge/plugin/package-lock.json
      - name: Install plugin dependencies (TypeScript compiler for the collector)
        run: npm ci
        working-directory: paperforge/plugin
      - name: Validate live architecture generator and contract parity (#231)
        run: python docs/architecture-audit-2026-08-06/build_audit.py --check
      - name: Run deterministic collector
        run: |
          python -m paperforge.architecture_audit.collectors.orchestrator \
            --root . \
            --contract docs/architecture-audit-2026-08-06/contract.json \
            --out /tmp/pf-architecture-audit
      - name: Evaluate the gate
        run: |
          # restore.display_only is the canonical-writer rule over the display
          # unit; a foreign writer for render/fulltext.md now produces a write
          # fact (#339), so an audited violation fails CI.  It stays satisfied
          # on clean source (no foreign writer observed).
          python -m paperforge.architecture_audit.report.gate \
            --audit /tmp/pf-architecture-audit/audit.json \
            --allowlist publication.uses_protocol canonical.no_ui_writer \
                        coverage.required_complete collectors.deterministic \
                        restore.display_only \
            --strict \
            --json
      - name: Report gate assessment
        if: always()
        run: |
          python - <<'PY'
          import json
          audit = json.load(open("/tmp/pf-architecture-audit/audit.json", encoding="utf-8"))
          assessment = audit["content"]["assessment"]
          reasons = ", ".join(assessment.get("reasons") or []) or "-"
          print(f"::notice title=Architecture gate assessment::"
                f"status={assessment.get('status')} eligible={assessment.get('gate_eligible')} "
                f"reasons={reasons}")
          PY
      - name: Preserve first-failure architecture evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-architecture-gate
          path: /tmp/pf-architecture-audit
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Merge gate
  # ---------------------------------------------------------------------------
  # #120-fix: OCR release-regression — the #118 fixes live in files the
  # unit/protocol jobs do not collect (progress contracts, object emission,
  # real-paper regressions, slugify); a future regression there must not
  # merge. Fast (<90s): runs the touched files + redo/rebuild neighbors.

  obsidian-e2e:
    name: H — Obsidian (${{ matrix.app }}, installer=${{ matrix.installer }})
    strategy:
      fail-fast: false
      # PRs run the newest combination for fast feedback; push, the nightly
      # schedule and manual runs keep the full declared matrix.  The browser
      # matrix is the expensive runner — host-agnostic cases belong to the CLI
      # host (job P, tests/harness/) and must not be proven here.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"app":"latest","installer":"latest"}]}' || '{"include":[{"app":"earliest","installer":"earliest"},{"app":"latest","installer":"latest"},{"app":"latest","installer":"earliest"}]}') }}
    runs-on: windows-latest
    # A cold install builds a venv and resolves the vector deps; A01 + A06
    # each carry a 25-minute outcome budget on a slow network.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: paperforge/plugin/package-lock.json
      - name: Give the E2E wheel a branch-only version
        shell: bash
        # The plugin-driven installs pin `paperforge[vector]==<manifest
        # version>`; PyPI serves the same 2.0.0rc5, and with both sources
        # reachable pip picks the index (observed: the A01 candidate then ran
        # without branch-only code and hung the later runtime-dependent
        # cases).  A `.post1` version cannot exist on PyPI, so the locally
        # built wheel is the only match while dependencies still resolve from
        # the index.  It must run BEFORE the editable install and the pointer
        # publish: the pointer records the installed version, and a pointer
        # published as 2.0.0rc5 under a .post1 package makes the installation
        # probe report `runtime_pointer_stale` (A01 needs_action).
        run: |
          python - <<'PY'
          import pathlib
          import shutil

          for path in (
              "paperforge/__init__.py",
              "paperforge/plugin/manifest.json",
          ):
              p = pathlib.Path(path)
              text = p.read_text(encoding="utf-8")
              p.write_text(text.replace("2.0.0rc5", "2.0.0rc5.post1"), encoding="utf-8")
          # The editable install above left an egg-info with the OLD version;
          # setuptools reuses it, producing a wheel whose METADATA disagrees
          # with its filename (pip then refuses the install on CI).
          for stale in ("paperforge.egg-info", "build", "dist"):
              shutil.rmtree(stale, ignore_errors=True)
          PY
      - name: Install Python package
        run: python -m pip install -e ".[test,vector]"
      - name: Publish isolated runtime pointer for E2E
        run: python -c "from paperforge.runtime_pointer import publish_pointer; print(publish_pointer())"
      - name: Install plugin dependencies
        run: npm ci
        working-directory: paperforge/plugin
      - name: Build the wheel the first-use journey installs
        shell: bash
        run: |
          python -m pip install --quiet build
          python -m build --wheel
          WHEEL=$(ls dist/*.whl | head -1)
          python - "$WHEEL" <<'PY' >> "$GITHUB_ENV"
          import hashlib
          import os
          import sys

          print(
              "PF_E2E_WHEEL_SHA256="
              + hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest()
          )
          # The plugin's pinned `paperforge[vector]==2.0.0rc5.post1` exists
          # only in dist/; without this pip finds no candidate at all.
          print("PIP_FIND_LINKS=" + os.path.abspath("dist"))
          PY
      - name: Run real Obsidian lifecycle (runtime + UI gate)
        run: npm run test:e2e
        working-directory: paperforge/plugin
        env:
          PF_OBSIDIAN_APP_VERSION: ${{ matrix.app }}
          PF_OBSIDIAN_INSTALLER_VERSION: ${{ matrix.installer }}
      - name: Upload runtime journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-journey-${{ matrix.app }}-${{ matrix.installer }}
          path: |
            paperforge/plugin/test/evidence/a01-first-use.json
            paperforge/plugin/test/evidence/a06-reinstall-switch.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload obsidian evidence (all cases)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-evidence-${{ matrix.app }}-${{ matrix.installer }}
          path: paperforge/plugin/test/evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Validate the runtime journey gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          evidence_dir = Path("paperforge/plugin/test/evidence")
          expected = {
              "a01-first-use.json": "A01",
              "a06-reinstall-switch.json": "A06",
          }
          manifest = json.loads(
              Path("paperforge/plugin/manifest.json").read_text(encoding="utf-8")
          )
          version = manifest["version"]
          failures: list[str] = []

          for name, case_id in expected.items():
              path = evidence_dir / name
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except OSError:
                  failures.append(f"{case_id}: evidence file missing")
                  continue
              # appendEvidence writes a JSON array of runs; judge the latest.
              runs = data if isinstance(data, list) else [data]
              latest = runs[-1] if runs and isinstance(runs[-1], dict) else {}
              if latest.get("status") != "VERIFIED":
                  failures.append(f"{case_id}: status={latest.get('status')}")
                  continue
              pointer = latest.get("pointer") or latest.get("pointer_after") or {}
              if pointer.get("paperforgeVersion") != version:
                  failures.append(
                      f"{case_id}: pointer version {pointer.get('paperforgeVersion')!r} "
                      f"!= {version!r}"
                  )

          if failures:
              print("runtime journey gate FAILED: " + "; ".join(failures))
              sys.exit(1)
          print(f"runtime journey VERIFIED: {', '.join(expected.values())} @ {version}")
          PY
      - name: Preserve first-failure Obsidian evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-obsidian-${{ matrix.app }}-${{ matrix.installer }}
          path: |
            paperforge/plugin/test/evidence
            paperforge/plugin/.obsidian-cache/*.log
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # P — CLI-host acceptance (host-agnostic cases, runner_kind=harness_cli)
  # ---------------------------------------------------------------------------
  # These cases drive the real `paperforge` CLI as a subprocess against a
  # disposable vault: no Obsidian, no WebDriver, no wheel build.  They run on the
  # declared P0 profile (Windows x64) because their evidence has to keep binding
  # to a host profile when a capability moves off the H matrix.  L1b ignores
  # tests/harness so a case runs once, here, and its junit + evidence index are
  # what a per-area report cites.
  cli-acceptance:
    name: P — CLI-host acceptance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with test deps
        # The full-suite job's extras: E05 migrates a legacy ChromaDB substrate, and
        # a case that branched on an absent dependency would be a skip in disguise.
        run: python -m pip install -e ".[test,vector,legacy-vector]"
      - name: Run the CLI-host acceptance cases
        shell: bash
        run: |
          python -m pytest tests/harness/ -m harness -v --tb=short --timeout=600 \
            --junit-xml="$RUNNER_TEMP/paperforge-cli-acceptance.xml"
        env:
          PF_EVIDENCE_DIR: ${{ github.workspace }}/tests/evidence/cli-acceptance
      - name: Upload CLI-host acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-acceptance-evidence
          path: tests/evidence/cli-acceptance
          if-no-files-found: error
          retention-days: 14
      - name: Preserve first-failure CLI-acceptance evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-cli-acceptance
          path: |
            ${{ runner.temp }}/paperforge-cli-acceptance.xml
            tests/evidence/cli-acceptance
          if-no-files-found: warn
          retention-days: 14

  alls-green:
    name: All Checks Passed
    if: always()
    needs:
      - static
      - unit-tests
      - python-suite
      - j-matrix
      - cli-acceptance
      - plugin-tests
      - e2e-tests
      - architecture-gate
      - obsidian-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
