name: Architecture Report Pages

# Deploys the live architecture audit report to GitHub Pages.
# The report is regenerated at HEAD on every relevant push, so the published
# revision/dirty metadata always matches the deployed tree. The HTML is a
# disposable ArchitectureReportView — this page never gates releases (see
# #134: CI gate consumes DeterministicAudit only).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: paperforge/plugin/package-lock.json
      - name: Install plugin dependencies (TypeScript compiler for the collector)
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: paperforge/plugin
      - name: Regenerate the audit report at HEAD
        # build_audit.py imports paperforge.architecture_audit via repo path,
        # runs the live Python/TypeScript collectors, and writes
        # survey/audit/review/view/traces/summary; render_html.py emits the
        # self-contained index.html. Generation is fail-fast: a missing or
        # ambiguous live evidence reference must not silently deploy the
        # previous report. On failure the artifact becomes an explicit failure
        # landing page instead (the stable URL never shows a stale audit as if
        # it were current).
        run: |
          REV="$(git rev-parse HEAD)"
          if python docs/architecture-audit-2026-08-06/build_audit.py \
             && python docs/architecture-audit-2026-08-06/render_html.py; then
            echo "ok ${REV}" > .pages-status.txt
          else
            echo "failed ${REV}" > .pages-status.txt
            find docs/architecture-audit-2026-08-06 -name '*.json' -delete
            cat > docs/architecture-audit-2026-08-06/index.html <<'PAGESEOF'
          <!DOCTYPE html>
          <html lang="zh">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>PaperForge 架构审计 — 生成失败</title>
          <style>
            body { margin:0; background:#0f1115; color:#e5e7eb; font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
            .wrap { max-width:720px; margin:0 auto; padding:64px 24px; }
            h1 { font-size:22px; }
            .fail { color:#dc2626; font-weight:700; }
            code { background:#1e232c; padding:1px 6px; border-radius:4px; }
            .sub { color:#9ca3af; font-size:13px; }
          </style>
          </head>
          <body>
          <div class="wrap">
            <h1><span class="fail">Architecture audit generation failed</span></h1>
            <p>本次 push（source revision <code>__REV__</code>）报告生成失败 ——
            callsite / 证据定位未能满足 fail-fast 要求（缺失或多义匹配）。</p>
            <p class="sub">稳定评审 URL 不静默展示旧报告：生成失败时本页替代旧审计页。
            请检查 <code>docs/architecture-audit-2026-08-06/build_audit.py</code> 的
            live collector contract / evidence references，修复后重推即可恢复。
          </div>
          </body>
          </html>
          PAGESEOF
            sed -i "s/__REV__/${REV}/" docs/architecture-audit-2026-08-06/index.html
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/architecture-audit-2026-08-06

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
