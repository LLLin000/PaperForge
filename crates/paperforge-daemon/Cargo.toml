[package]
name = "paperforge-daemon"
version = "2.0.2"
edition = "2021"
description = "Cross-platform ultra-low-memory native control & SQLite FTS5 query sidecar for PaperForge"
license = "MIT"

[[bin]]
name = "paperforge-daemon"
path = "src/main.rs"

[dependencies]
flate2 = "1.0"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
unicode-normalization = "0.1"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
